<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title" th:text="|${year}年${month}月|">2026年4月</h1>
        <nav class="calendar-navigation" aria-label="月の移動">
            <div class="calendar-navigation-group">
                <a class="link" th:href="@{/calendar(year=${previousYear}, month=${previousMonth})}">前の月</a>
                <a class="link" th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}">次の月</a>
            </div>
            <div class="calendar-navigation-group">
                <a class="link" href="/todos">表で見る</a>
                <a class="link" href="/todos/new">新規登録</a>
            </div>
        </nav>
        <table class="calendar-table" th:attr="data-from=${from}, data-to=${to}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${#numbers.sequence(0, dates.size() / 7 - 1)}">
                    <td th:each="day : ${dates.subList(week * 7, week * 7 + 7)}"
                        th:attr="data-date=${day != null ? #temporals.format(day, 'yyyy-MM-dd') : null}"
                        th:text="${day != null ? #temporals.format(day, 'd') : ''}"></td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        async function loadTodos() {
            const calendar = document.querySelector(".calendar-table");
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const params = new URLSearchParams({ from: from, to: to });
            const res = await fetch(`/api/todos?${params.toString()}`);
            const todos = await res.json();
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

            document.querySelectorAll(".calendar-table [data-date]").forEach(cell => {
                const date = cell.dataset.date;
                const cellTodos = todos.filter(todo => todo.dueDate === date);

                cellTodos.slice(0, 3).forEach(todo => {
                    const name = document.createElement("a");
                    name.href = `/todos/${todo.id}/edit`;
                    name.textContent = todo.title;
                    if (todo.dueDate < today && !todo.completed) {
                        name.style.color = "red";
                    }
                    const todoLink = document.createElement("div");
                    todoLink.appendChild(name);
                    cell.appendChild(todoLink);
                });

                const remainingCount = cellTodos.length - 3;
                if (remainingCount > 0) {
                    const more = document.createElement("div");
                    more.textContent = `ほか ${remainingCount}件`;
                    cell.appendChild(more);
                }
            });
        }

        async function loadHolidays() {
            const calendar = document.querySelector(".calendar-table");
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const params = new URLSearchParams({ from: from, to: to });
            const res = await fetch(`/api/holidays?${params.toString()}`);

            if (res.headers.has("X-Holidays-Unavailable")) {
                const message = document.createElement("p");
                message.textContent = "祝日を取れませんでした";
                document.querySelector("main").prepend(message);
            }

            const holidays = await res.json();
            document.querySelectorAll(".calendar-table [data-date]").forEach(cell => {
                const date = cell.dataset.date;
                const weekday = new Date(`${date}T00:00:00`).getDay();

                if (holidays[date]) {
                    cell.style.backgroundColor = "#fef3c7";
                    cell.title = holidays[date];
                } else if (weekday === 0) {
                    cell.style.backgroundColor = "#fee2e2";
                } else if (weekday === 6) {
                    cell.style.backgroundColor = "#dbeafe";
                }
            });
        }

        loadTodos();
        loadHolidays();
    </script>
</body>
</html>
