<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">やること一覧</h1>
        <p class="flash" th:if="${message}" th:text="${message}"></p>
        <p><a class="btn" href="/todos/new">新規登録</a></p>
        <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>
        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}">
                    <td th:text="${todo.title}">やること</td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</td>
                    <td th:text="${todo.dueDate}">期限</td>
                    <td th:text="${todo.completed ? '完了' : '未完了'}">状態</td>
                    <td><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
